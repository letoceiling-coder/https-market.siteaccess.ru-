# Isolated vhost for helphomes.ru. Do not use as default_server.
# HTTPS is added only after a valid Let's Encrypt certificate exists.

map $http_upgrade $helphomes_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name helphomes.ru www.helphomes.ru;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(self), camera=(), microphone=()" always;

    access_log /var/log/nginx/helphomes.ru.access.log;
    error_log  /var/log/nginx/helphomes.ru.error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location /_next/static/ {
        proxy_pass http://172.18.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://172.18.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $helphomes_connection_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
