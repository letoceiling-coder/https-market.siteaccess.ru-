[helphomes-api]
user = helphomes-api
group = helphomes-api
listen = /run/php/php8.3-fpm-helphomes-api.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 20s
pm.max_requests = 200
chdir = /var/www/helphomes-api
catch_workers_output = yes
php_admin_value[memory_limit] = 128M
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 20M
php_admin_flag[display_errors] = off
php_admin_value[error_log] = /var/www/helphomes-api/storage/logs/php-fpm.log
