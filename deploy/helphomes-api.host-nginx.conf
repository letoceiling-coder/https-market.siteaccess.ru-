# Host-only Laravel gateway. Listens on the docker bridge, not on public :80/:443.
server {
    listen 172.18.0.1:8073;
    listen 127.0.0.1:8073;
    server_name api.helphomes.ru avito.rinulik.ru;

    root /var/www/helphomes-api/public;
    index index.php;

    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ^~ /storage/ {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm-helphomes-api.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
